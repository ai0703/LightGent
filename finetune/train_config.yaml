model_name: Qwen/Qwen3-4B-Instruct-2507
train_data: /vol/data/train.jsonl
val_data: /vol/data/val.jsonl
max_seq_len: 16384
max_drop_frac: 0.15
packing: false
num_train_epochs: 2
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.0001
lr_scheduler_type: cosine
warmup_ratio: 0.03
logging_steps: 10
save_strategy: epoch
eval_strategy: epoch
save_total_limit: 2
gradient_checkpointing: true
bf16: true
fp16: false
seed: 42
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16
