model_name: Qwen/Qwen3-4B-Instruct-2507
train_data: /vol/data/train.jsonl
val_data: /vol/data/val.jsonl
max_seq_len: 16384
max_drop_frac: 0.15
packing: false
# 81 training rows: at grad-accum 8 and 2 epochs this is only ~20 optimizer
# steps, too few for a LoRA to converge. 4 epochs at accum 4 gives ~80 steps.
# Eval runs each epoch so the best checkpoint can be chosen over the last.
num_train_epochs: 4
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 0.0001
lr_scheduler_type: cosine
warmup_ratio: 0.03
logging_steps: 10
save_strategy: epoch
eval_strategy: epoch
save_total_limit: 2
gradient_checkpointing: true
bf16: true
fp16: false
seed: 42
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16
# Paged 8-bit optimiser: LoRA updates are small, and paging the optimiser
# state keeps 16k-token sequences within GPU memory.
optim: paged_adamw_8bit
