# fly.toml — LightGent research service on Fly.io.
# Called by enrichos-app's worker over Fly private networking
# (http://lightgent-app.internal:8100/enrich-company). Kept always-on so a
# 60s research call is never killed by autostop mid-run.
app = "lightgent-app"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8100
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 24
    soft_limit = 16

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
